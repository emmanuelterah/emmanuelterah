name: Update README cards

on:
  schedule:
    - cron: "17 3 * * *"   # daily
  workflow_dispatch:        # run it by hand from the Actions tab
  push:
    paths:
      - .github/workflows/readme-cards.yml

jobs:
  update-cards:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=emmanuelterah&show_icons=true&theme=tokyonight&hide_border=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=emmanuelterah&layout=compact&theme=tokyonight&hide_border=true
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Shpeed repo card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=emmanuelterah&repo=Shpeed&theme=tokyonight&hide_border=true
          path: profile/shpeed.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
